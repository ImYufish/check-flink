<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e27" />
    <meta name="robots" content="noindex, nofollow" />
    <title>友链状态检测 · 星空</title>
    <link rel="icon" href="/favicon.ico" />
    <link
      href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      /* ============================================
       * 1. CSS 变量（暗黑/亮色双主题）
       * ============================================ */
      :root {
        /* 暗黑/星空主题（默认） */
        --bg-sky-top: #0a0e27;
        --bg-sky-bottom: #1a1f3a;
        --bg-overlay: radial-gradient(
          ellipse at top,
          var(--bg-sky-top) 0%,
          var(--bg-sky-bottom) 100%
        );
        --star-color: rgba(255, 255, 255, 0.9);
        --accent-blue: #4f9eff;
        --accent-pink: #ff6b9d;
        --accent-gold: #ffd93d;
        --accent-green: #4ade80;
        --accent-red: #f87171;
        --text-primary: #e4e8f1;
        --text-secondary: #8a94b0;
        --text-muted: #5a6480;
        --card-bg: rgba(255, 255, 255, 0.04);
        --card-bg-hover: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.1);
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --glass-blur: blur(20px) saturate(180%);
        --cloud-opacity: 0;
        --header-gradient: linear-gradient(
          135deg,
          var(--accent-blue),
          var(--accent-pink)
        );
      }

      [data-theme="light"] {
        --bg-sky-top: #87ceeb;
        --bg-sky-bottom: #e0f6ff;
        --bg-overlay: linear-gradient(
          180deg,
          var(--bg-sky-top) 0%,
          var(--bg-sky-bottom) 100%
        );
        --star-color: rgba(255, 217, 61, 0.5);
        --text-primary: #2c3e50;
        --text-secondary: #5a6c7d;
        --text-muted: #95a5a6;
        --card-bg: rgba(255, 255, 255, 0.7);
        --card-bg-hover: rgba(255, 255, 255, 0.9);
        --card-border: rgba(255, 255, 255, 0.5);
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        --cloud-opacity: 0.85;
        --header-gradient: linear-gradient(
          135deg,
          #3498db,
          #9b59b6
        );
      }

      /* ============================================
       * 2. 全局重置
       * ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica,
          Arial, sans-serif;
        background: var(--bg-overlay);
        color: var(--text-primary);
        line-height: 1.6;
        position: relative;
        min-height: 100vh;
        padding: 40px 20px 20px;
        transition:
          background 0.6s ease,
          color 0.3s ease;
      }

      /* ============================================
       * 3. 星空背景层
       * ============================================ */
      #stars-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -3;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      [data-theme="light"] #stars-canvas {
        opacity: 0.3;
      }

      /* 流星 */
      .shooting-star {
        position: fixed;
        width: 100px;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 1) 100%
        );
        z-index: -2;
        pointer-events: none;
        transform-origin: 0 50%;
        animation: shoot 1.2s linear forwards;
      }

      @keyframes shoot {
        0% {
          transform: rotate(35deg) translateX(0);
          opacity: 1;
        }
        100% {
          transform: rotate(35deg) translateX(800px);
          opacity: 0;
        }
      }

      [data-theme="light"] .shooting-star {
        display: none;
      }

      /* 云朵（仅白天显示） */
      .cloud {
        position: fixed;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 100px;
        z-index: -2;
        pointer-events: none;
        opacity: var(--cloud-opacity);
        transition: opacity 0.6s ease;
        filter: blur(2px);
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.5);
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
      }

      .cloud-1 {
        width: 120px;
        height: 40px;
        top: 15%;
        left: -150px;
        animation: float-cloud 60s linear infinite;
      }
      .cloud-1::before {
        width: 60px;
        height: 60px;
        top: -30px;
        left: 20px;
      }
      .cloud-1::after {
        width: 50px;
        height: 50px;
        top: -25px;
        left: 60px;
      }

      .cloud-2 {
        width: 160px;
        height: 50px;
        top: 35%;
        left: -200px;
        animation: float-cloud 80s linear infinite;
        animation-delay: -20s;
      }
      .cloud-2::before {
        width: 80px;
        height: 80px;
        top: -40px;
        left: 30px;
      }
      .cloud-2::after {
        width: 70px;
        height: 70px;
        top: -35px;
        left: 80px;
      }

      .cloud-3 {
        width: 100px;
        height: 35px;
        top: 60%;
        left: -150px;
        animation: float-cloud 50s linear infinite;
        animation-delay: -35s;
      }
      .cloud-3::before {
        width: 50px;
        height: 50px;
        top: -25px;
        left: 15px;
      }
      .cloud-3::after {
        width: 40px;
        height: 40px;
        top: -20px;
        left: 50px;
      }

      .cloud-4 {
        width: 140px;
        height: 45px;
        top: 80%;
        left: -180px;
        animation: float-cloud 70s linear infinite;
        animation-delay: -10s;
      }
      .cloud-4::before {
        width: 70px;
        height: 70px;
        top: -35px;
        left: 25px;
      }
      .cloud-4::after {
        width: 60px;
        height: 60px;
        top: -30px;
        left: 70px;
      }

      @keyframes float-cloud {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(calc(100vw + 300px));
        }
      }

      /* ============================================
       * 4. 右上角控制按钮
       * ============================================ */
      .control-buttons {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 100;
      }

      .control-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        color: var(--text-primary);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--card-shadow);
      }

      .control-btn:hover {
        background: var(--card-bg-hover);
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 6px 28px rgba(79, 158, 255, 0.3);
      }

      .control-btn:active {
        transform: translateY(0) scale(0.95);
      }

      /* ============================================
       * 5. 主容器
       * ============================================ */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      /* ============================================
       * 6. 头部
       * ============================================ */
      .header {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeInUp 0.8s ease;
      }

      .title {
        font-size: 2.6rem;
        font-weight: 700;
        background: var(--header-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
        letter-spacing: 2px;
      }

      .title-star {
        display: inline-block;
        color: var(--accent-gold);
        -webkit-text-fill-color: var(--accent-gold);
        font-size: 1.8rem;
        margin: 0 12px;
        animation: star-spin 4s ease-in-out infinite;
      }

      @keyframes star-spin {
        0%,
        100% {
          transform: rotate(0deg) scale(1);
          opacity: 0.8;
        }
        50% {
          transform: rotate(180deg) scale(1.2);
          opacity: 1;
        }
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .update-time {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .update-time span {
        color: var(--accent-blue);
        font-weight: 600;
      }

      /* ============================================
       * 7. 统计卡片
       * ============================================ */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: var(--card-shadow);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.05),
          transparent
        );
        transition: left 0.6s ease;
      }

      .stat-card:hover::before {
        left: 100%;
      }

      .stat-card:hover {
        background: var(--card-bg-hover);
        transform: translateY(-3px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .stat-icon {
        font-size: 28px;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
      }

      .stat-total .stat-icon {
        color: var(--accent-blue);
        background: rgba(79, 158, 255, 0.15);
      }
      .stat-normal .stat-icon {
        color: var(--accent-green);
        background: rgba(74, 222, 128, 0.15);
      }
      .stat-error .stat-icon {
        color: var(--accent-red);
        background: rgba(248, 113, 113, 0.15);
      }
      .stat-backlink .stat-icon {
        color: var(--accent-pink);
        background: rgba(255, 107, 157, 0.15);
      }

      .stat-info {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .stat-label {
        color: var(--text-secondary);
        font-size: 0.85rem;
        margin-bottom: 4px;
      }

      .stat-value {
        color: var(--text-primary);
        font-size: 1.8rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      /* ============================================
       * 8. 章节标题
       * ============================================ */
      .section-title {
        color: var(--text-primary);
        font-size: 1.3rem;
        font-weight: 600;
        margin: 30px 0 16px;
        padding-left: 12px;
        border-left: 3px solid var(--accent-blue);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title .count {
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 400;
        background: var(--card-bg);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid var(--card-border);
      }

      /* 失效友链标题用红色左边框 */
      .section-title.error-title {
        border-left: 3px solid var(--accent-red);
      }

      .section-title.error-title .count {
        color: var(--accent-red);
        border-color: rgba(248, 113, 113, 0.3);
      }

      /* ============================================
       * 9. 列表视图
       * ============================================ */
      .link-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }

      .link-item {
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        animation: fadeInUp 0.6s ease both;
      }

      .link-item.is-error {
        border-left: 3px solid var(--accent-red);
      }

      .link-item:hover {
        background: var(--card-bg-hover);
        transform: translateX(4px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      /* 紧凑列表行（卡片视图下失效友链用） */
      .link-row {
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
        transition: all 0.2s ease;
        animation: fadeInUp 0.5s ease both;
      }
      .link-row.is-error {
        border-left: 3px solid var(--accent-red);
      }
      .link-row:hover {
        background: var(--card-bg-hover);
        transform: translateX(4px);
      }
      .row-name {
        color: var(--text-primary);
        font-weight: 500;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-host {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .row-fail {
        color: var(--accent-red);
        font-weight: 600;
        font-size: 0.85rem;
      }
      .row-latency {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      .row-latency.timeout {
        color: var(--accent-red);
      }

      .link-name {
        color: var(--text-primary);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.2s ease;
      }

      .link-name:hover {
        color: var(--accent-blue);
      }

      .link-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .fail-count {
        color: var(--accent-red);
        font-weight: 600;
      }

      /* ============================================
       * 10. 状态点
       * ============================================ */
      .status-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        position: relative;
      }

      .status-dot::before {
        content: "";
        position: absolute;
        top: -3px;
        left: -3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        animation: pulse 1.8s infinite;
      }

      .status-normal {
        background: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
      }
      .status-normal::before {
        background: rgba(74, 222, 128, 0.3);
      }

      .status-slow {
        background: var(--accent-gold);
        box-shadow: 0 0 8px var(--accent-gold);
      }
      .status-slow::before {
        background: rgba(255, 217, 61, 0.3);
      }

      .status-error {
        background: var(--accent-red);
        box-shadow: 0 0 8px var(--accent-red);
      }
      .status-error::before {
        background: rgba(248, 113, 113, 0.3);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      /* 反链图标 */
      .backlink-icon {
        font-size: 14px;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .backlink-true {
        color: var(--accent-green);
      }
      .backlink-false {
        color: var(--accent-red);
      }
      .backlink-icon:hover {
        transform: scale(1.3);
      }

      /* ============================================
       * 11. 卡片视图
       * ============================================ */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .friend-card {
        position: relative;
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        overflow: hidden;
        color: inherit;
        display: flex;
        flex-direction: column;
        min-height: 220px;
        box-shadow: var(--card-shadow);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        animation: fadeInUp 0.6s ease both;
      }

      .friend-card:hover {
        transform: translateY(-6px);
        border-color: var(--accent-blue);
        box-shadow:
          0 12px 36px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(79, 158, 255, 0.3);
      }

      /* 没有背景图时的 fallback：使用更显眼的渐变底色 */
      .friend-card.no-bg {
        background: linear-gradient(
          135deg,
          rgba(79, 158, 255, 0.15) 0%,
          rgba(167, 139, 250, 0.15) 50%,
          rgba(236, 72, 153, 0.15) 100%
        );
      }

      [data-theme="light"] .friend-card.no-bg {
        background: linear-gradient(
          135deg,
          rgba(79, 158, 255, 0.18) 0%,
          rgba(167, 139, 250, 0.18) 50%,
          rgba(236, 72, 153, 0.18) 100%
        );
      }

      /* 透明覆盖链接层（占满整个卡片） */
      .card-link {
        position: absolute;
        inset: 0;
        z-index: 5;
        text-decoration: none;
      }

      /* 卡片内部任何 <a>（如反链按钮）z-index 高于 .card-link */
      .backlink-icon {
        position: relative;
        z-index: 6;
      }

      .card-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        opacity: 1;
        z-index: 0;
        transition: transform 0.6s ease;
      }

      .friend-card:hover .card-bg {
        transform: scale(1.05);
      }

      .card-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* 仅在文字区域底部加轻微深色蒙版（保证文字可读，不影响整体背景图清晰度） */
        background: linear-gradient(
          180deg,
          rgba(10, 14, 39, 0) 0%,
          rgba(10, 14, 39, 0) 30%,
          rgba(10, 14, 39, 0.4) 70%,
          rgba(10, 14, 39, 0.7) 100%
        );
        z-index: 1;
        pointer-events: none;
      }

      [data-theme="light"] .card-overlay {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0) 30%,
          rgba(255, 255, 255, 0.3) 70%,
          rgba(255, 255, 255, 0.6) 100%
        );
      }

      .card-content {
        position: relative;
        z-index: 2;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .card-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid var(--card-border);
        flex-shrink: 0;
        object-fit: cover;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .card-title-area {
        flex: 1;
        min-width: 0;
      }

      .card-name {
        color: var(--text-primary);
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.8),
          0 0 8px rgba(0, 0, 0, 0.4);
      }

      [data-theme="light"] .card-name {
        text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
      }

      .card-host {
        color: var(--text-secondary);
        font-size: 0.8rem;
        font-family:
          ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }

      [data-theme="light"] .card-host {
        color: var(--text-secondary);
        text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
      }

      .card-footer {
        position: relative;
        z-index: 2;
        padding: 12px 20px;
        border-top: 1px solid var(--card-border);
        display: flex;
        justify-content: space-between;
        align-items: center;

    <script>
      // ============================================
      // 1. 星空背景生成（Canvas）
      // ============================================
      (function initStarfield() {
        const canvas = document.getElementById("stars-canvas");
        const ctx = canvas.getContext("2d");
        let stars = [];
        let mouseX = 0;
        let mouseY = 0;
        let width = 0;
        let height = 0;
        let animFrameId = null;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          generateStars();
        }

        function generateStars() {
          // 根据屏幕面积动态调整星星数量（密度恒定）
          const area = width * height;
          const count = Math.floor(area / 6000);
          stars = [];
          for (let i = 0; i < count; i++) {
            stars.push({
              x: Math.random() * width,
              y: Math.random() * height,
              r: Math.random() * 1.2 + 0.3,
              baseAlpha: Math.random() * 0.6 + 0.2,
              twinkleSpeed: Math.random() * 0.02 + 0.005,
              twinklePhase: Math.random() * Math.PI * 2,
              depth: Math.random() * 0.5 + 0.5, // 用于视差
            });
          }
        }

        function render(time) {
          ctx.clearRect(0, 0, width, height);
          // 视差偏移（鼠标移动时）
          const parallaxX = (mouseX - width / 2) * 0.02;
          const parallaxY = (mouseY - height / 2) * 0.02;

          for (const star of stars) {
            const twinkle =
              Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.4 + 0.6;
            const alpha = star.baseAlpha * twinkle;
            const x = star.x + parallaxX * star.depth;
            const y = star.y + parallaxY * star.depth;

            // 主体星星
            ctx.beginPath();
            ctx.arc(x, y, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fill();

            // 亮星加光晕
            if (star.r > 1) {
              ctx.beginPath();
              ctx.arc(x, y, star.r * 3, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
              ctx.fill();
            }
          }

          animFrameId = requestAnimationFrame(render);
        }

        // 流星
        function spawnShootingStar() {
          // 仅在暗黑主题生成
          if (document.body.dataset.theme !== "dark") {
            setTimeout(spawnShootingStar, 5000);
            return;
          }

          const star = document.createElement("div");
          star.className = "shooting-star";
          star.style.top = Math.random() * 50 + "%";
          star.style.left = Math.random() * 50 + "%";
          document.body.appendChild(star);

          setTimeout(() => star.remove(), 1500);

          // 下一颗：3-12 秒后
          setTimeout(spawnShootingStar, 3000 + Math.random() * 9000);
        }

        // 事件监听
        window.addEventListener("resize", resize);
        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        // 初始化
        resize();
        animFrameId = requestAnimationFrame(render);
        setTimeout(spawnShootingStar, 2000);
      })();

      // ============================================
      // 2. 主题切换
      // ============================================
      (function initTheme() {
        const STORAGE_KEY = "flink-theme";
        const body = document.body;
        const btn = document.getElementById("theme-toggle");
        const icon = btn.querySelector("i");

        function applyTheme(theme) {
          body.dataset.theme = theme;
          icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
          btn.title = theme === "dark" ? "切换到白天" : "切换到星空";
          // 同步 meta theme-color
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.content = theme === "dark" ? "#0a0e27" : "#87ceeb";
          }
        }

        // 初始化：localStorage > 系统偏好 > 默认 dark
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === "light" || saved === "dark") {
          applyTheme(saved);
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
          applyTheme("light");
        } else {
          applyTheme("dark");
        }

        btn.addEventListener("click", () => {
          const next = body.dataset.theme === "dark" ? "light" : "dark";
          applyTheme(next);
          localStorage.setItem(STORAGE_KEY, next);
        });
      })();

      // ============================================
      // 3. 视图切换
      // ============================================
      (function initView() {
        const STORAGE_KEY = "flink-view";
        const body = document.body;
        const btn = document.getElementById("view-toggle");
        const icon = btn.querySelector("i");
        const listView = document.querySelector('[data-view-content="list"]');
        const cardView = document.querySelector('[data-view-content="cards"]');

        function applyView(view) {
          body.dataset.view = view;
          icon.className =
            view === "list" ? "fa-solid fa-th-large" : "fa-solid fa-list";
          btn.title = view === "list" ? "切换到卡片视图" : "切换到列表视图";
          listView.hidden = view !== "list";
          cardView.hidden = view !== "cards";
        }

        const saved = localStorage.getItem(STORAGE_KEY);
        applyView(saved === "cards" ? "cards" : "list");

        btn.addEventListener("click", () => {
          const next = body.dataset.view === "list" ? "cards" : "list";
          applyView(next);
          localStorage.setItem(STORAGE_KEY, next);
          // 首次切到卡片视图时，确保已渲染
          if (next === "cards" && !cardView.dataset.rendered) {
            renderCardView(window.__flinkData);
            cardView.dataset.rendered = "1";
          }
        });
      })();

      // ============================================
      // 4. 工具函数
      // ============================================
      function getHost(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }

      function statusClass(latency) {
        if (latency === -1) return "status-error";
        if (latency > 4) return "status-slow";
        return "status-normal";
      }

      function statusLabel(latency) {
        if (latency === -1) return "超时";
        if (latency < 1) return Math.round(latency * 1000) + " MS";
        if (latency < 10) return latency.toFixed(2) + " s";
        return Math.round(latency) + " s";
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ============================================
      // 5. 渲染列表视图
      // ============================================
      function renderListView(data) {
        const errorList = document.getElementById("error-list");
        const otherList = document.getElementById("other-list");
        const errorCount = document.getElementById("error-count");
        const otherCount = document.getElementById("other-count");

        const errorLinks = data.link_status.filter((l) => l.latency === -1);
        const otherLinks = data.link_status.filter((l) => l.latency !== -1);

        errorCount.textContent = errorLinks.length;
        otherCount.textContent = otherLinks.length;

        const renderItem = (link) => {
          const cls = statusClass(link.latency);
          const label = statusLabel(link.latency);
          const isError = link.latency === -1;

          let backlinkIcon = "";
          if (link.linkpage && link.linkpage.trim() !== "") {
            const icon = link.has_author_link
              ? "fa-heart-circle-check backlink-true"
              : "fa-heart-circle-xmark backlink-false";
            const title = link.has_author_link ? "友链页面有反链" : "友链页面无反链";
            backlinkIcon = `<a href="${escapeHtml(
              link.linkpage
            )}" target="_blank" rel="noopener noreferrer" class="backlink-icon ${icon.startsWith(
              "fa-heart-circle-check"
            ) ? "backlink-true" : "backlink-false"}" title="${title}">
              <i class="fa-solid ${icon}"></i>
            </a>`;
          }

          return `
            <div class="link-item ${isError ? "is-error" : ""}" style="animation-delay: ${Math.random() * 0.3}s">
              <a class="link-name" href="${escapeHtml(link.link)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(link.name)}">
                ${escapeHtml(link.name)}
              </a>
              <div class="link-meta">
                ${isError ? `<span class="fail-count">×${link.fail_count || 0}</span>` : `<span>${label}</span>`}
                ${backlinkIcon}
                <span class="status-dot ${cls}" title="${label}"></span>
              </div>
            </div>
          `;
        };

        errorList.innerHTML =
          errorLinks.length > 0
            ? errorLinks.map(renderItem).join("")
            : '<div class="loading" style="padding: 20px"><i class="fa-solid fa-check"></i>暂无失效友链</div>';

        otherList.innerHTML = otherLinks.map(renderItem).join("");
      }

      // ============================================
      // 6. 渲染卡片视图
      // 关键设计：卡片用 <div> 容器，name 用 <a>，反链按钮独立
      // 避免 <a> 嵌套 <a> 导致 HTML 解析器强制拆分的 bug
      // 失效友链单独渲染到 #error-list-cards（保持列表形式）
      // ============================================
      function renderCardView(data) {
        const cardGrid = document.getElementById("card-grid");
        const errorList = document.getElementById("error-list-cards");
        const otherCount = document.getElementById("other-count-cards");
        const errorCount = document.getElementById("error-count-cards");

        if (!data || !data.link_status || data.link_status.length === 0) {
          cardGrid.innerHTML = '<div class="loading">暂无数据</div>';
          errorList.innerHTML = "";
          otherCount.textContent = "0";
          errorCount.textContent = "0";
          return;
        }

        // 分离失效友链和其他友链
        const errorLinks = data.link_status.filter((l) => l.latency === -1);
        const otherLinks = data.link_status.filter((l) => l.latency !== -1);

        // 渲染失效友链（用与列表视图相同的紧凑列表样式）
        errorList.innerHTML = errorLinks.length
          ? errorLinks
              .map((link) => {
                const host = getHost(link.link);
                const cls = statusClass(link.latency);
                const label = statusLabel(link.latency);
                return `
                <a class="link-row is-error" href="${escapeHtml(link.link)}" target="_blank" rel="noopener noreferrer">
                  <span class="row-name">${escapeHtml(link.name)}</span>
                  <span class="row-host">${escapeHtml(host)}</span>
                  <span class="row-fail">×${link.fail_count || 0}</span>
                  <span class="row-latency timeout">${label}</span>
                  <span class="status-dot ${cls}" title="${label}"></span>
                </a>
              `;
              })
              .join("")
          : '<div class="loading">无失效友链 🎉</div>';

        // 渲染其他友链（卡片网格，<div> 容器避免 <a> 嵌套）
        cardGrid.innerHTML = otherLinks.length
          ? otherLinks
              .map((link, i) => {
                const cls = statusClass(link.latency);
                const label = statusLabel(link.latency);
                const host = getHost(link.link);
                const avatarUrl = `https://www.google.com/s2/favicons?domain=${host}&sz=64`;

                // 背景图：有 siteshot 就用
                const hasShot = link.siteshot && link.siteshot.trim() !== "";
                const bgStyle = hasShot
                  ? `background-image: url('${escapeHtml(link.siteshot)}');`
                  : "";

                // 反链图标（独立 <a>，不嵌套）
                let backlinkIcon = "";
                if (link.linkpage && link.linkpage.trim() !== "") {
                  const icon = link.has_author_link
                    ? "fa-heart-circle-check backlink-true"
                    : "fa-heart-circle-xmark backlink-false";
                  const title = link.has_author_link
                    ? "友链页面有反链"
                    : "友链页面无反链";
                  backlinkIcon = `<a class="backlink-icon ${link.has_author_link ? "backlink-true" : "backlink-false"}" href="${escapeHtml(link.linkpage)}" target="_blank" rel="noopener noreferrer" title="${title}" onclick="event.stopPropagation()">
                    <i class="fa-solid ${icon}"></i>
                  </a>`;
                }

                return `
                <div class="friend-card ${hasShot ? "has-bg" : "no-bg"}" style="animation-delay: ${(i % 10) * 0.05}s">
                  <a class="card-link" href="${escapeHtml(link.link)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(link.name)}"></a>
                  <div class="card-bg" style="${bgStyle}"></div>
                  <div class="card-overlay"></div>
                  <div class="card-content">
                    <div class="card-header">
                      <img class="card-avatar" src="${avatarUrl}" alt="" loading="lazy" onerror="this.style.opacity='0.3'">
                      <div class="card-title-area">
                        <h3 class="card-name">${escapeHtml(link.name)}</h3>
                        <div class="card-host">${escapeHtml(host)}</div>
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <span class="card-latency">${label}</span>
                    <div class="card-actions">
                      ${backlinkIcon}
                      <span class="status-dot ${cls}" title="${label}"></span>
                    </div>
                  </div>
                </div>
              `;
              })
              .join("")
          : '<div class="loading">无其他友链</div>';

        otherCount.textContent = otherLinks.length;
        errorCount.textContent = errorLinks.length;
      }

      // ============================================
      // 7. 主流程：加载数据并渲染
      // ============================================
      async function loadData() {
        try {
          // 加 ?t= 时间戳避免 CDN / 浏览器命中旧缓存
          const res = await fetch(`/result.json?t=${Date.now()}`, { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          window.__flinkData = data;

          // 更新时间
          document.getElementById("update-time").textContent =
            data.timestamp || "--";

          // 统计卡
          document.getElementById("total-links").textContent =
            data.total_count ?? data.link_status.length;
          document.getElementById("normal-links").textContent =
            data.accessible_count ??
            data.link_status.filter((l) => l.latency !== -1).length;
          document.getElementById("error-links").textContent =
            data.inaccessible_count ??
            data.link_status.filter((l) => l.latency === -1).length;
          document.getElementById("backlink-count").textContent =
            data.has_author_link_count ??
            data.link_status.filter((l) => l.has_author_link).length;

          // 渲染两种视图
          renderListView(data);
          renderCardView(data);
          document
            .querySelector('[data-view-content="cards"]')
            .setAttribute("data-rendered", "1");
        } catch (err) {
          console.error("加载 result.json 失败:", err);
          document.getElementById("error-list").innerHTML =
            '<div class="loading" style="color: var(--accent-red)"><i class="fa-solid fa-triangle-exclamation"></i>加载失败，请稍后重试</div>';
          document.getElementById("update-time").textContent = "加载失败";
        }
      }

      // ============================================
      // 8. 启动
      // ============================================
      document.getElementById("year").textContent = new Date().getFullYear();
      loadData();
    </script>
  </body>
</html>
