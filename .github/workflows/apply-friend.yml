name: Apply Friend Link

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  actions: write

jobs:
  apply:
    name: 解析 / Playwright 验证 / 写入友链
    runs-on: ubuntu-latest
    # 触发条件：
    #  - issues opened/reopened 且带「友链申请」标签（或标题前缀）
    #  - issue_comment created 且 Issue 同时带「友链申请」「needs-update」标签、且评论者不是机器人（回复即重验）
    if: >-
      (github.event_name == 'issues' &&
        (contains(github.event.issue.labels.*.name, '友链申请') || startsWith(github.event.issue.title, '[友链申请]'))) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.issue.labels.*.name, '友链申请') &&
        contains(github.event.issue.labels.*.name, 'needs-update') &&
        github.event.comment.user.login != 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 解析 Issue
        id: parse
        uses: actions/github-script@v7
        env:
          AUTHOR_URL: ${{ secrets.AUTHOR_URL }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const eventName = github.event_name;
            const isReverify = (eventName === 'issue_comment');

            const issue = (eventName === 'issue_comment') ? github.event.issue : context.payload.issue;
            const body = issue.body || "";

            // 从 Issue Forms 渲染后的 body 中按中文标签提取字段
            function field(label) {
              const re = new RegExp("###\\s*" + label + "\\s*\\n+([\\s\\S]*?)(?=\\n###|$)");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const title   = field("网站名称").replace(/\s+/g, " ").trim();
            const siteurl = field("网站链接").trim();
            const linkpage = field("友链页面 URL").trim();
            const desc    = field("网站描述").trim();
            const imgurl  = field("网站头像 URL").trim();

            const missing = [];
            if (!title)   missing.push("网站名称");
            if (!siteurl) missing.push("网站链接");
            if (!desc)    missing.push("网站描述");
            if (!imgurl)  missing.push("网站头像 URL");

            if (missing.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ 申请信息不完整，缺少：" + missing.join("、") + "。请补充后在本 Issue 下回复以重新验证（Issue 保持开放）。",
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["needs-update"] });
              core.setOutput('shouldVerify', 'false');
              return;
            }

            // 规范化 siteurl：补 https:// 前缀（若缺失）
            let finalSiteurl = siteurl;
            if (!/^https?:\/\//i.test(finalSiteurl)) {
              finalSiteurl = "https://" + finalSiteurl.replace(/^\/+/, "");
            }

            // 读取现有清单做去重（仅首次申请模式；重验模式跳过，因为友链可能已存在）
            let friends = [];
            try {
              const fd = await github.rest.repos.getContent({ owner, repo, path: "static/friends.json", ref: "main" });
              friends = JSON.parse(Buffer.from(fd.data.content, "base64").toString("utf8")).friends || [];
            } catch (e) {
              core.warning("读取 static/friends.json 失败: " + e.message);
            }

            const norm = (u) => (u || "").trim().toLowerCase().replace(/^https?:\/\//i, "").replace(/\/$/, "");
            const exists = friends.some((f) => norm(f.siteurl) === norm(finalSiteurl));

            if (!isReverify && exists) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "ℹ️ 友链 **" + title + "**（" + finalSiteurl + "）已存在，无需重复添加。",
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
              core.setOutput('shouldVerify', 'false');
              return;
            }

            const authorUrl = process.env.AUTHOR_URL || "https://x1anyu.cn";
            fs.writeFileSync('verify_input.json', JSON.stringify({
              siteurl: finalSiteurl,
              linkpage: linkpage,
              authorUrl: authorUrl,
              issue_number: issue_number,
              title: title,
              desc: desc,
              imgurl: imgurl,
              mode: isReverify ? 'reverify' : 'apply',
            }, null, 2));
            core.setOutput('shouldVerify', 'true');

      - name: Playwright 验证（可访问性 + 反链）
        id: verify
        if: steps.parse.outputs.shouldVerify == 'true'
        run: node .github/scripts/verify-friend.mjs
        env:
          VERIFY_INPUT: verify_input.json
          VERIFY_RESULT: verify_result.json

      - name: 应用结果（写入 / 拒收）
        if: steps.parse.outputs.shouldVerify == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const input = JSON.parse(fs.readFileSync('verify_input.json', 'utf8'));
            const result = JSON.parse(fs.readFileSync('verify_result.json', 'utf8'));
            const finalSiteurl = input.siteurl;
            const linkpage = input.linkpage;
            const title = input.title;
            const desc = input.desc;
            const imgurl = input.imgurl;
            const issueId = input.issue_number;

            if (!result.pass) {
              let reason = result.reason || "验证未通过";
              if (result.reachable === false) reason = "站点不可访问（" + (result.status ? "HTTP " + result.status : "无法连接") + "）";
              else if (result.hasReciprocal === false) reason = "未检测到指向本站的真实友链";
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ **验证未通过**：" + reason + "。\n\n请修复后在本 Issue 下回复任意内容即可重新验证（Issue 保持开放）。",
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["needs-update"] });
              // 保持开放，不关闭
              return;
            }

            // 通过：写入 friends.json（带 issue_id）
            const defaultBranch = "main";
            const filePath = "static/friends.json";
            const fd = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: defaultBranch });
            const json = JSON.parse(Buffer.from(fd.data.content, "base64").toString("utf8"));
            if (!Array.isArray(json.friends)) json.friends = [];

            const norm = (u) => (u || "").trim().toLowerCase().replace(/^https?:\/\//i, "").replace(/\/$/, "");
            const exists = json.friends.some((f) => norm(f.siteurl) === norm(finalSiteurl));
            if (!exists) {
              const newFriend = {
                title: title,
                imgurl: imgurl,
                desc: desc,
                siteurl: finalSiteurl,
                tags: ["Blog"],
                weight: 5,
                enabled: true,
                issue_id: issueId,
              };
              if (linkpage) newFriend.linkpage = linkpage;
              json.friends.push(newFriend);
              json.updatedAt = new Date().toISOString().slice(0, 10);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: filePath,
                message: "💛 新增友链：" + title,
                content: Buffer.from(JSON.stringify(json, null, 2), "utf8").toString("base64"),
                sha: fd.data.sha,
                branch: defaultBranch,
              });
            }

            // 评论 + 关闭 + 移除 needs-update 标签
            const iss = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = (iss.data.labels || []).map((l) => l.name);
            if (labels.includes("needs-update")) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "needs-update" }).catch(() => {});
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: "✅ 反链核验与可访问性检查均通过（引擎：" + (result.engine || "playwright") + "），已自动添加友链 **" + title + "**（" + finalSiteurl + "）。\n\n已触发 `check_links` 重新部署，`friends.yufish.cn/friends.json` 预计几分钟内更新；博客页面加载时会直接读取最新清单（无需重新构建博客）。",
            });
            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

            // 立即触发 check_links 重新部署，让 friends.json 几分钟内上线
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: "check_links.yml",
                ref: defaultBranch,
              });
            } catch (e) {
              core.warning("触发 check_links 重新部署失败（可手动在 Actions 页面 Run workflow）: " + e.message);
            }
