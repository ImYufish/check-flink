name: Apply Friend Link

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: write
  actions: write

jobs:
  apply:
    name: 解析 Issue 并写入友链清单
    runs-on: ubuntu-latest
    # 仅处理带「友链申请」标签、或标题以 [友链申请] 开头的 issue
    if: >-
      contains(github.event.issue.labels.*.name, '友链申请') ||
      startsWith(github.event.issue.title, '[友链申请]')
    steps:
      - name: 解析并写入
        uses: actions/github-script@v7
        env:
          AUTHOR_URL: ${{ secrets.AUTHOR_URL }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const issue = context.payload.issue;
            const body = issue.body || "";

            // 从 Issue Forms 渲染后的 body 中按中文标签提取字段
            function field(label) {
              const re = new RegExp("###\\s*" + label + "\\s*\\n+([\\s\\S]*?)(?=\\n###|$)");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            // 反链检测：判断页面是否含指向本站的真实超链接（<a href> / data-url 等）
            async function hasAuthorLink(pageUrl, authorUrl) {
              const bare = authorUrl.replace(/^https?:\/\//i, "").replace(/\/+$/, "").toLowerCase();
              const variants = new Set([bare, "www." + bare]);
              if (bare.startsWith("www.")) variants.add(bare.slice(4));
              const resp = await fetch(pageUrl, {
                headers: { "User-Agent": "Mozilla/5.0 (compatible; FriendLinkBot/1.0)" },
                redirect: "follow",
              });
              if (!resp.ok) return false;
              const html = await resp.text();
              const attrRe = /(?:href|data-url|data-link|data-href)\s*=\s*["']([^"']+)["']/gi;
              let m2, candidates = [];
              while ((m2 = attrRe.exec(html))) candidates.push(m2[1]);
              const expanded = candidates.slice();
              for (const c of candidates) {
                for (const inner of c.matchAll(/https?:\/\/([^/?#\s"'>]+)/g)) expanded.push("https://" + inner[1]);
                for (const inner of c.matchAll(/(?<!:)\/\/([^/?#\s"'>]+)/g)) expanded.push("//" + inner[1]);
              }
              for (const u of expanded) {
                const host = u.replace(/^https?:\/\//i, "").replace(/^\/\//, "").split("/")[0].toLowerCase();
                if (variants.has(host)) return true;
              }
              return false;
            }

            const title   = field("网站名称").replace(/\s+/g, " ").trim();
            const siteurl = field("网站链接").trim();
            const linkpage = field("友链页面 URL").trim();
            const desc    = field("网站描述").trim();
            const imgurl  = field("网站头像 URL").trim();

            const missing = [];
            if (!title)   missing.push("网站名称");
            if (!siteurl) missing.push("网站链接");
            if (!desc)    missing.push("网站描述");
            if (!imgurl)  missing.push("网站头像 URL");

            if (missing.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ 申请信息不完整，缺少：" + missing.join("、") + "。请补充后重新提交。",
              });
              core.warning("缺少字段：" + missing.join("、"));
              return;
            }

            // 规范化 siteurl：补 https:// 前缀（若缺失）
            let finalSiteurl = siteurl;
            if (!/^https?:\/\//i.test(finalSiteurl)) {
              finalSiteurl = "https://" + finalSiteurl.replace(/^\/+/, "");
            }

            // 反链硬门槛：申请人须在其友链页(或首页)链回本站，否则拒绝
            const authorUrl = process.env.AUTHOR_URL || "https://x1anyu.cn";
            const pagesToCheck = [linkpage, finalSiteurl].filter(Boolean);
            let linkedBack = false;
            for (const p of pagesToCheck) {
              try {
                if (await hasAuthorLink(p, authorUrl)) { linkedBack = true; break; }
              } catch (e) {
                core.warning("反链检测异常 (" + p + "): " + e.message);
              }
            }
            if (!linkedBack) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ **未通过反链核验**：在你的站点（" + (linkpage || finalSiteurl) + "）中未检测到指向 **" + authorUrl + "** 的真实友链。\n\n友链为互换，请先在你的友链页面添加本站友链（链接到 " + authorUrl + "），确认生效后再申请。关闭本 Issue 后重新打开即可重试。",
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
              return;
            }

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch || "main";
            const filePath = "static/friends.json";

            // 读取现有清单
            let fileData;
            try {
              fileData = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: defaultBranch,
              });
            } catch (e) {
              core.setFailed("读取 " + filePath + " 失败：" + e.message);
              return;
            }

            const content = Buffer.from(fileData.data.content, "base64").toString("utf8");
            const json = JSON.parse(content);
            if (!Array.isArray(json.friends)) json.friends = [];

            // 去重：同一 siteurl 已存在则跳过
            const norm = (u) => (u || "").trim().toLowerCase().replace(/^https?:\/\//i, "").replace(/\/$/, "");
            const exists = json.friends.some((f) => norm(f.siteurl) === norm(finalSiteurl));
            if (exists) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "ℹ️ 友链 **" + title + "**（" + finalSiteurl + "）已存在，无需重复添加。",
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
              return;
            }

            const newFriend = {
              title: title,
              imgurl: imgurl,
              desc: desc,
              siteurl: finalSiteurl,
              tags: ["Blog"],
              weight: 5,
              enabled: true,
            };
            if (linkpage) newFriend.linkpage = linkpage;

            json.friends.push(newFriend);
            json.updatedAt = new Date().toISOString().slice(0, 10);

            const newContent = JSON.stringify(json, null, 2);

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath,
              message: "💛 新增友链：" + title,
              content: Buffer.from(newContent, "utf8").toString("base64"),
              sha: fileData.data.sha,
              branch: defaultBranch,
            });

            // 立即触发 check_links 重新部署，让 friends.json 几分钟内上线（无需等定时巡检）
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: "check_links.yml",
                ref: defaultBranch,
              });
            } catch (e) {
              core.warning("触发 check_links 重新部署失败（可手动在 Actions 页面 Run workflow）: " + e.message);
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: "✅ 反链核验通过，已自动添加友链 **" + title + "**（" + finalSiteurl + "）。\n\n已触发 `check_links` 重新部署，`friends.yufish.cn/friends.json` 预计几分钟内更新；博客页面加载时会直接读取最新清单（无需重新构建博客）。",
            });
            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
