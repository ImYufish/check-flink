name: Check Links and Generate JSON

on:
  schedule:
    # 每天 2 次：状态检测（保留原有行为）
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    # 每 6 天 1 次：友链主页截图（新增，节省 CI 配额）
    - cron: '30 1 1,7,13,19,25 * *'
  workflow_dispatch:
    inputs:
      task:
        description: '选择要执行的任务（仅手动触发时有效）'
        required: false
        type: choice
        options:
          - status_only        # 仅状态检测
          - screenshots_only   # 仅截图（使用最近一次状态检测数据）
          - both               # 状态检测 + 截图
        default: status_only
      target_link:
        description: '只处理指定友链（填名称或URL关键词，留空=处理全部）'
        required: false
        type: string
        default: ''

env:
  TZ: Asia/Shanghai

jobs:
  check_links:
    name: 检测友链状态
    runs-on: ubuntu-latest
    # 始终运行状态检测（保证 result.json 总是最新，截图任务有数据可读；screenshots_only 模式也跑一次轻量级检测）
    if: ${{ true }}
    steps:
    - name: Pull latest repository
      uses: actions/checkout@v4

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download result.json artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        branch: main
        name: 'result_json'
        path: './'
        if_no_artifact_found: warn

    - name: Run Python script to check frined-links
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SOURCE_URL: ${{ secrets.SOURCE_URL }}
        AUTHOR_URL: ${{ secrets.AUTHOR_URL }}
        # 关键：screenshots_only 模式下，check_links 跑全部友链（不应用 target_link 过滤），
        # 避免把 result.json 过滤成只剩 target_link 那一条、丢失其他友链的状态和截图 URL。
        # target_link 过滤只应在 take_screenshots job 中生效。
        TARGET_LINK: ${{ inputs.task == 'screenshots_only' && '' || inputs.target_link }}
      run: |
        echo "SOURCE_URL: $SOURCE_URL"
        echo "AUTHOR_URL: $AUTHOR_URL"
        echo "TARGET_LINK: $TARGET_LINK"
        python main.py

    - name: Upload result.json as artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'result_json'
        path: './result.json'
        retention-days: 10

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit and push
      run: |
        cp ./result.json static/
        cd static
        git init
        git add .
        git commit -m "⏱️GitHub Action每日定时更新"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:page

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 6

  take_screenshots:
    name: 截取友链主页截图
    runs-on: ubuntu-latest
    needs: [check_links]
    # 仅在【每 6 天定时】或【手动选择 screenshots_only / both】时执行
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 1 1,7,13,19,25 * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'screenshots_only' || inputs.task == 'both')) }}
    steps:
    - name: Pull latest repository
      uses: actions/checkout@v4
      with:
        # 关键：显式 checkout page 分支，否则 schedule 触发时默认 checkout main 分支，
        # main 分支不含 result.json，会污染 take_screenshots job 的工作区
        ref: page

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable

    - name: Install Chinese fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei

    - name: Download result.json artifact (from check_links)
      uses: actions/download-artifact@v4
      with:
        name: 'result_json'
        path: './'
        # 改为 error：拿不到 result.json 直接让 job 失败，暴露问题
        if-no-result-found: error

    - name: Run screenshot
      env:
        IMG_UPLOAD_URL: ${{ secrets.IMG_UPLOAD_URL }}
        IMG_AUTH_CODE: ${{ secrets.IMG_AUTH_CODE }}
        CHROME_BIN: /usr/bin/google-chrome
        SCREENSHOT_WORKERS: '2'
        TARGET_LINK: ${{ inputs.target_link }}
      run: |
        # ===== 调试：确认 result.json 状态 =====
        echo "==== result.json 状态 ===="
        if [ -f ./result.json ]; then
          echo "✅ result.json 存在"
          echo "📦 大小: $(stat -c%s ./result.json) bytes"
          echo "📋 link_status[0].siteshot 字段："
          python -c "import json; d=json.load(open('./result.json')); s=d.get('link_status',[]); print(s[0].get('siteshot','<MISSING>') if s else '<EMPTY>')"
          echo "📊 全部 siteshot 字段统计："
          python -c "import json; d=json.load(open('./result.json')); s=d.get('link_status',[]); empty=sum(1 for x in s if not x.get('siteshot')); print(f'  共 {len(s)} 条，空 siteshot {empty} 条')"
        else
          echo "❌ result.json 不存在（download-artifact 失败）"
        fi
        echo "==========================="

        echo "IMG_UPLOAD_URL: $IMG_UPLOAD_URL"
        echo "TARGET_LINK: $TARGET_LINK"
        python screenshot_runner.py

    - name: Upload updated result.json as artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'result_json_with_shot'
        path: './result.json'
        retention-days: 10

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit and push (with siteshot)
      run: |
        # ===== 调试：确认要推送的 result.json 状态 =====
        echo "==== 推送前 result.json 状态 ===="
        if [ -f ./result.json ]; then
          echo "📦 result.json 大小: $(stat -c%s ./result.json) bytes"
          echo "📊 siteshot 统计："
          python -c "import json; d=json.load(open('./result.json')); s=d.get('link_status',[]); empty=sum(1 for x in s if not x.get('siteshot')); thumio=sum(1 for x in s if 'thum.io' in (x.get('siteshot') or '')); real=len(s)-empty-thumio; print(f'  共 {len(s)} 条：空={empty} | thum.io={thumio} | 真图床={real}')"
          echo "📋 前 3 条 siteshot 预览："
          python -c "import json; d=json.load(open('./result.json')); [print(f'  - {x.get(\"name\",\"?\")}: {x.get(\"siteshot\",\"<空>\")[:90]}') for x in d.get('link_status',[])[:3]]"
        else
          echo "❌ result.json 不存在，无法推送"
          exit 1
        fi
        echo "================================"

        cp ./result.json static/
        cd static
        git init
        git add .
        git commit -m "📸友链主页截图（每 6 天自动更新）"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:page

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: [check_links, take_screenshots]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
