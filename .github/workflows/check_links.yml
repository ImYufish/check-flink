name: Check Links and Generate JSON

on:
  schedule:
    # 每天 2 次：状态检测（保留原有行为）
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    # 每 6 天 1 次：友链主页截图（新增，节省 CI 配额）
    - cron: '30 1 1,7,13,19,25 * *'
  workflow_dispatch:
    inputs:
      task:
        description: '选择要执行的任务（仅手动触发时有效）'
        required: false
        type: choice
        options:
          - status_only        # 仅状态检测
          - screenshots_only   # 仅截图（使用最近一次状态检测数据）
          - both               # 状态检测 + 截图
        default: status_only
      target_link:
        description: '只处理指定友链（填名称或URL关键词，多个用逗号分隔，留空=处理全部）'
        required: false
        type: string
        default: ''

env:
  TZ: Asia/Shanghai

jobs:
  check_links:
    name: 检测友链状态
    runs-on: ubuntu-latest
    # 始终运行状态检测（保证 result.json 总是最新，截图任务有数据可读；screenshots_only 模式也跑一次轻量级检测）
    if: ${{ true }}
    steps:
    - name: Pull latest repository
      uses: actions/checkout@v4

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download result.json from page branch
      run: |
        echo "从 page 分支拉取最新 result.json（含历史截图 URL）..."
        # 先试根目录（page 分支实际在根目录），失败回退到 static/ 子目录
        HTTP_CODE=$(curl -sL -w "%{http_code}" -o ./result.json \
          "https://raw.githubusercontent.com/${{ github.repository }}/page/result.json")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "⚠️ 根目录未找到（HTTP $HTTP_CODE），尝试 static/result.json..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o ./result.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/page/static/result.json")
        fi
        if [ "$HTTP_CODE" != "200" ] || [ ! -s ./result.json ]; then
          echo "⚠️ page 分支无 result.json（HTTP $HTTP_CODE），首次运行，创建空数据"
          echo "{}" > ./result.json
        else
          echo "✅ 下载成功（$(stat -c%s ./result.json) bytes）"
          python check_siteshot.py ./result.json
        fi
        # 【修复截图丢失】留一份下载时的 baseline，状态检测后再交叉回填 siteshot（双重保险）
        cp -f ./result.json ./result.baseline.json
        echo "baseline 已保存: $(stat -c%s ./result.baseline.json) bytes"

    - name: Detect changes (auto-set TARGET_LINK)
      id: detect_changes
      env:
        SOURCE_URL: ${{ secrets.SOURCE_URL }}
      run: |
        echo "==== 变更检测 ===="
        # 优先从 GitHub raw 拉取最新 friendsConfig.ts（绕过 Vercel 部署延迟）
        echo "从 GitHub raw 拉取最新 friendsConfig.ts..."
        TS_URL="https://raw.githubusercontent.com/fqzlr/fqzlr-bk/main/src/config/friendsConfig.ts"
        HTTP_CODE=000
        for i in 1 2 3; do
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o ./friends.latest.ts "$TS_URL" 2>/dev/null)
          if [ "$HTTP_CODE" = "200" ] && [ -s ./friends.latest.ts ]; then
            break
          fi
          echo "第 $i 次从 GitHub raw 拉取失败（HTTP $HTTP_CODE），${i}<3 时 2 秒后重试..."
          [ "$i" -lt 3 ] && sleep 2
        done
        if [ "$HTTP_CODE" = "200" ] && [ -s ./friends.latest.ts ]; then
          echo "✅ 下载成功（$(stat -c%s ./friends.latest.ts) bytes）"
          # 使用 friends_watcher.py 解析 TS → 生成 JSON 格式
          if python -c "import friends_watcher" 2>/dev/null; then
            python3 -c "import friends_watcher,json;arr=friends_watcher.parse_friends_config('friends.latest.ts');json.dump({'link_list':[{'name':it.get('title',''),'link':it.get('siteurl',''),'linkpage':it.get('linkpage')or it.get('siteurl','')} for it in arr if it.get('enabled',True)]},open('friends.latest.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
            echo "✅ 解析完成，生成 friends.latest.json"
          else
            echo "⚠️ friends_watcher 不可用，降级到 SOURCE_URL"
            HTTP_CODE2=$(curl -sL -w "%{http_code}" -o ./friends.latest.json "$SOURCE_URL" 2>/dev/null)
            if [ "$HTTP_CODE2" != "200" ] || [ ! -s ./friends.latest.json ]; then
              echo "❌ SOURCE_URL 也失败（HTTP $HTTP_CODE2），跳过变更检测"
              echo "TARGET_LINK_DETECTED=" >> $GITHUB_ENV
              exit 0
            fi
          fi
        else
          echo "⚠️ GitHub raw 不可用（HTTP $HTTP_CODE），降级到 SOURCE_URL..."
          HTTP_CODE2=$(curl -sL -w "%{http_code}" -o ./friends.latest.json "$SOURCE_URL" 2>/dev/null)
          if [ "$HTTP_CODE2" != "200" ] || [ ! -s ./friends.latest.json ]; then
            echo "❌ SOURCE_URL 也失败（HTTP $HTTP_CODE2），跳过变更检测，走全量检测"
            echo "TARGET_LINK_DETECTED=" >> $GITHUB_ENV
            exit 0
          fi
          echo "✅ SOURCE_URL 下载成功（$(stat -c%s ./friends.latest.json) bytes）"
        fi
        echo "对比 result.json 检测变更..."
        if [ -f ./result.json ] && [ -s ./result.json ]; then
          # 优先使用 friends_watcher.py compare（如果可用）
          if python -c "import friends_watcher" 2>/dev/null; then
            DETECTED=$(python friends_watcher.py compare \
              --current ./friends.latest.json \
              --historical ./result.json 2>/dev/null || true)
          else
            # 回退：python3 -c 紧凑脚本（避免 YAML 多行缩进问题）
            DETECTED=$(python3 -c "import json,sys;C=json.load(open('friends.latest.json'));H=json.load(open('result.json'));L=C.get('link_list',[])or(C if isinstance(C,list)else[]);S=H.get('link_status',[])or[];P={e.get('link',''):e for e in S if e.get('link')};X=[];E=sys.stderr;exec('for I in L:\n K=(I.get(\"link\")or\"\").strip()\n if not K: continue\n if K not in P:\n  X.append(K);print(\"[detect] 新增: \"+K,file=E)\n else:\n  p=P[K];pn=(p.get(\"name\")or\"\").strip();pl=(p.get(\"linkpage\")or\"\").strip()\n  cn=(I.get(\"name\")or\"\").strip();cl=(I.get(\"linkpage\")or\"\").strip()\n  if pn!=cn or pl!=cl: X.append(K);print(\"[detect] 修改: \"+K,file=E)');print('|'.join(dict.fromkeys(X)))" 2>&1)
          fi
          if [ -n "$DETECTED" ]; then
            echo "检测到变更的友链: $DETECTED"
            echo "TARGET_LINK_DETECTED=$DETECTED" >> $GITHUB_ENV
          else
            echo "未检测到变更"
            echo "TARGET_LINK_DETECTED=" >> $GITHUB_ENV
          fi
        else
          echo "result.json 不存在或为空，首次运行，走全量检测"
          echo "TARGET_LINK_DETECTED=" >> $GITHUB_ENV
        fi
        rm -f ./friends.latest.json ./friends.latest.ts

    - name: Run Python script to check frined-links
      # screenshots_only 模式：只截图不检测，跳过 Python，避免覆盖 result.json 里已有的状态
      if: ${{ inputs.task != 'screenshots_only' }}
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SOURCE_URL: ${{ secrets.SOURCE_URL }}
        AUTHOR_URL: ${{ secrets.AUTHOR_URL }}
        # 优先级：手动输入的 target_link > 自动检测的变更 > 空（全量）
        # 关键：screenshots_only 模式下，check_links 跑全部友链（不应用 target_link 过滤），
        # 避免把 result.json 过滤成只剩 target_link 那一条、丢失其他友链的状态和截图 URL。
        # target_link 过滤只应在 take_screenshots job 中生效。
        TARGET_LINK: ${{ inputs.task == 'screenshots_only' && '' || (inputs.target_link || env.TARGET_LINK_DETECTED) }}
      run: |
        echo "SOURCE_URL: $SOURCE_URL"
        echo "AUTHOR_URL: $AUTHOR_URL"
        echo "TARGET_LINK: $TARGET_LINK"
        python main.py

    - name: Cross-fill siteshot from baseline (defense-in-depth)
      run: |
        echo "==== baseline vs 检测后 siteshot 交叉回填 ===="
        python3 - <<'PY'
        import json, os, re, sys
        def norm(u):
            u=(u or '').strip().lower()
            u=re.sub(r'^https?://','',u).rstrip('/')
            for s in ('?','#'):
                u=u.split(s,1)[0] if s in u else u
            return u
        def host(u):
            return norm(u).split('/',1)[0] if norm(u) else ''
        baseline=sys.argv[1] if len(sys.argv)>1 else 'result.baseline.json'
        target='result.json'
        if not os.path.exists(baseline) or os.path.getsize(baseline)==0 or not os.path.exists(target):
            print('跳过（无 baseline 或 result.json）')
            sys.exit(0)
        with open(baseline,encoding='utf-8') as f:
            B=json.load(f)
        with open(target,encoding='utf-8') as f:
            T=json.load(f)
        bl=B.get('link_status',[]) or []
        tl=T.get('link_status',[]) or []
        # 建 baseline 多键索引
        idx_ex={}; idx_nm={}; idx_hh={}; idx_ho={}
        for e in bl:
            L=e.get('link','') or ''
            N=(e.get('name','') or '').strip().lower()
            if L: idx_ex.setdefault(L,e)
            n=norm(L); h=host(L)
            if n and n not in idx_nm: idx_nm[n]=e
            if N and h and (N,h) not in idx_hh: idx_hh[(N,h)]=e
            if h: idx_ho.setdefault(h,[]).append(e)
        def lookup(lk,nm):
            if lk in idx_ex: return idx_ex[lk]
            n=norm(lk); h=host(lk); nm=(nm or '').strip().lower()
            if n and n in idx_nm: return idx_nm[n]
            if nm and h and (nm,h) in idx_hh: return idx_hh[(nm,h)]
            if h and len(idx_ho.get(h,[]))==1: return idx_ho[h][0]
            if h and len(idx_ho.get(h,[]))==1 and nm:
                o=idx_ho[h][0]; on=(o.get('name','') or '').strip().lower()
                if on and (nm==on or nm in on or on in nm): return o
            return {}
        filled=0; before_empty=sum(1 for e in tl if not (e.get('siteshot') or '').strip())
        for e in tl:
            shot=(e.get('siteshot') or '').strip()
            if shot: continue
            m=lookup(e.get('link',''), e.get('name',''))
            ps=(m.get('siteshot') or '').strip()
            if ps:
                e['siteshot']=ps
                filled+=1
        after_empty=sum(1 for e in tl if not (e.get('siteshot') or '').strip())
        print(f"空 siteshot: {before_empty} → {after_empty}（本次找回 {filled}）")
        T['link_status']=tl
        with open(target,'w',encoding='utf-8') as f:
            json.dump(T,f,ensure_ascii=False,indent=4)
        PY
        python check_siteshot.py ./result.json

    - name: Incremental screenshot (only when changes detected)
      if: ${{ inputs.task != 'screenshots_only' }}
      env:
        IMG_UPLOAD_URL: ${{ secrets.IMG_UPLOAD_URL }}
        IMG_AUTH_CODE: ${{ secrets.IMG_AUTH_CODE }}
        SCREENSHOT_WORKERS: '2'
        TARGET_LINK: ${{ env.TARGET_LINK_DETECTED || inputs.target_link }}
      run: |
        if [ -z "$TARGET_LINK" ]; then
          echo "无变更友链，跳过增量截图"
          exit 0
        fi
        echo "检测到友链变更，增量截图..."
        echo "TARGET_LINK: $TARGET_LINK"
        echo "IMG_UPLOAD_URL: $IMG_UPLOAD_URL"

        # 安装 Chrome
        if ! command -v google-chrome &>/dev/null; then
          echo "安装 Chrome..."
          if command -v apt-get &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable 2>/dev/null || \
              (wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \
               sudo dpkg -i /tmp/chrome.deb 2>/dev/null; sudo apt-get install -f -y -qq)
            rm -f /tmp/chrome.deb
          fi
          echo "Chrome 安装完成"
        fi
        # 安装中文字体
        if ! fc-list :lang=zh 2>/dev/null | grep -q .; then
          sudo apt-get install -y -qq fonts-wqy-microhei fonts-wqy-zenhei 2>/dev/null || true
        fi

        export CHROME_BIN=$(command -v google-chrome || echo "/usr/bin/google-chrome")
        echo "CHROME_BIN: $CHROME_BIN"

        echo "==== result.json 状态（截图前） ===="
        python check_siteshot.py ./result.json

        python screenshot_runner.py

        echo "==== result.json 状态（截图后） ===="
        python check_siteshot.py ./result.json

    - name: Upload result.json as artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'result_json'
        path: './result.json'
        retention-days: 10

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit and push
      run: |
        echo "==== 推送前（check_links）result.json 状态 ===="
        if [ -f ./result.json ]; then
          echo "📦 result.json 大小: $(stat -c%s ./result.json) bytes"
          python check_siteshot.py ./result.json
        else
          echo "❌ result.json 不存在"
        fi
        echo "================================================"

        cp ./result.json static/
        cd static
        git init
        git add .
        git commit -m "⏱️GitHub Action每日定时更新"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:page

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 6

  take_screenshots:
    name: 截取友链主页截图
    runs-on: ubuntu-latest
    # 加回 needs: [check_links]：截图 job 等状态检测 job 跑完并 push result.json 后再执行，
    # 避免「both / screenshots_only 手动」两个 job 并发强推 page 分支、互相覆盖丢数据。
    # check_links 的 if 恒为 true，定时（每日/每6天）与手动各场景它都会先跑，
    # 所以这里依赖它既能消除竞态、又不破坏定时截图。
    needs: [check_links]
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 1 1,7,13,19,25 * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'screenshots_only' || inputs.task == 'both')) }}
    steps:
    - name: Pull latest repository
      uses: actions/checkout@v4
      # 注意：必须用默认分支（main），不能 ref: page
      # page 分支只含静态文件（result.json/index.html 等），没有 requirements.txt 和 Python 脚本
      # 这里的 result.json 由下方 download-artifact 步骤从 check_links job 拿，不依赖 checkout

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable

    - name: Install Chinese fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei

    - name: Download result.json from page branch
      run: |
        echo "从 page 分支拉取最新 result.json（含状态 + 历史截图 URL）..."
        # 先试根目录（page 分支实际在根目录），失败回退到 static/ 子目录
        HTTP_CODE=$(curl -sL -w "%{http_code}" -o ./result.json \
          "https://raw.githubusercontent.com/${{ github.repository }}/page/result.json")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "⚠️ 根目录未找到（HTTP $HTTP_CODE），尝试 static/result.json..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o ./result.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/page/static/result.json")
        fi
        if [ "$HTTP_CODE" != "200" ] || [ ! -s ./result.json ]; then
          echo "❌ page 分支无 result.json（HTTP $HTTP_CODE），截图 job 无法运行"
          exit 1
        fi
        echo "✅ 下载成功（$(stat -c%s ./result.json) bytes）"
        python check_siteshot.py ./result.json

    - name: Run screenshot
      env:
        IMG_UPLOAD_URL: ${{ secrets.IMG_UPLOAD_URL }}
        IMG_AUTH_CODE: ${{ secrets.IMG_AUTH_CODE }}
        CHROME_BIN: /usr/bin/google-chrome
        SCREENSHOT_WORKERS: '2'
        TARGET_LINK: ${{ inputs.target_link }}
      run: |
        echo "==== result.json 状态 ===="
        if [ -f ./result.json ]; then
          echo "✅ result.json 存在"
          echo "📦 大小: $(stat -c%s ./result.json) bytes"
          python check_siteshot.py ./result.json
        else
          echo "❌ result.json 不存在（download-artifact 失败）"
        fi
        echo "==========================="

        echo "IMG_UPLOAD_URL: $IMG_UPLOAD_URL"
        echo "TARGET_LINK: $TARGET_LINK"
        python screenshot_runner.py

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit and push (with siteshot)
      run: |
        echo "==== 推送前 result.json 状态 ===="
        if [ -f ./result.json ]; then
          echo "📦 result.json 大小: $(stat -c%s ./result.json) bytes"
          python check_siteshot.py ./result.json
        else
          echo "❌ result.json 不存在，无法推送"
          exit 1
        fi
        echo "================================"

        cp ./result.json static/
        cd static
        git init
        git add .
        git commit -m "📸友链主页截图（每 6 天自动更新）"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:page

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: [check_links, take_screenshots]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
