name: 友链申请
description: 申请与本站交换友链（提交后自动核验反链与可访问性）
title: "[友链申请] "
labels: ["友链申请"]
body:
  - type: input
    id: site_name
    attributes:
      label: 网站名称
      description: 你的站点名称（将显示在友链卡片上）
    validations:
      required: true
  - type: input
    id: site_url
    attributes:
      label: 网站链接
      description: 你的站点首页 URL，例如 https://example.com
    validations:
      required: true
  - type: input
    id: link_page
    attributes:
      label: 友链页面 URL
      description: 你已在页面上添加本站友链的地址（留空则默认用「网站链接」核验反链）
    validations:
      required: false
  - type: input
    id: site_desc
    attributes:
      label: 网站描述
      description: 一句话简介（将显示在友链卡片上）
    validations:
      required: true
  - type: input
    id: avatar_url
    attributes:
      label: 网站头像 URL
      description: 头像图片地址（建议 100x100 以上）
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        > 提交后机器人会自动访问你的站点，核验：① 站点可访问（失败重试 3 次）；② 页面含指向本站的真实友链。
        > 两项均通过才会加入友链清单；未通过会在此 Issue 评论原因并打 `待更新` 标签，修复后回复任意内容即可重新验证。
