name: 友链申请
description: 提交友链申请，审核通过后自动加入友链列表
title: "[友链申请] "
labels: ["友链申请"]
body:
  - type: markdown
    attributes:
      value: |
        感谢申请友链！提交后机器人会自动核验：**你的站点须可正常访问，且已添加指向本站的友链（反链）**，两项均通过才会加入列表。请先确保你的站点能打开、并在友链页加上本站链接，再提交申请。
  - type: input
    id: title
    attributes:
      label: 网站名称
      description: 你的站点名称
      placeholder: 例如 临渊羡鱼
    validations:
      required: true
  - type: input
    id: siteurl
    attributes:
      label: 网站链接
      description: 你的站点首页 URL（含 https://）
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: linkpage
    attributes:
      label: 友链页面 URL
      description: 你站点上放了本站友链的那一页。机器人会爬这页核验反链，**强烈建议填写**，留空则改爬首页。
      placeholder: https://example.com/friends/
    validations:
      required: false
  - type: input
    id: desc
    attributes:
      label: 网站描述
      description: 一句话介绍你的站点
      placeholder: 分享生活与技术
    validations:
      required: true
  - type: input
    id: imgurl
    attributes:
      label: 网站头像 URL
      description: 头像图片地址
      placeholder: https://example.com/avatar.png
    validations:
      required: true
